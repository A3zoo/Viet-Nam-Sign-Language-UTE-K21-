[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnam-sign-language-recognition"
version = "1.0.0"
description = "Vietnamese Sign Language Recognition system using LSTM and ST-GCN models"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "UTE-K21 Team"}
]
keywords = [
    "sign-language",
    "recognition",
    "deep-learning",
    "lstm",
    "st-gcn",
    "computer-vision",
    "mediapipe"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Core dependencies
dependencies = [
    "fastapi>=0.110.2",
    "uvicorn[standard]>=0.29.0",
    "python-dotenv>=1.0.1",
    "pydantic>=1.10.14",
    "numpy>=1.24.2",
    "scikit-learn>=1.4.1",
    "joblib>=1.3.2",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]

# Optional dependencies
[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
ml = [
    "tensorflow>=2.16.1",
    "opencv-python>=4.9.0",
    "matplotlib>=3.8.3",
    "seaborn>=0.13.2",
    "pandas>=1.5.3",
]
all = [
    "vietnam-sign-language-recognition[dev,ml]",
]

[project.urls]
Homepage = "https://github.com/your-username/Viet-Nam-Sign-Language-UTE-K21-"
Documentation = "https://github.com/your-username/Viet-Nam-Sign-Language-UTE-K21-/blob/main/README.md"
Repository = "https://github.com/your-username/Viet-Nam-Sign-Language-UTE-K21-"
Issues = "https://github.com/your-username/Viet-Nam-Sign-Language-UTE-K21-/issues"

[project.scripts]
slr-backend = "SLR_BE.main:main"

# Tool configurations
[tool.setuptools]
packages = ["SLR_BE"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.pkl", "*.pth", "*.json", "*.yaml", "*.yml"]

# Black code formatter
[tool.black]
line-length = 100
target-version = ['py37', 'py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | node_modules
)/
'''

# isort import sorter
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["*/migrations/*", "*/node_modules/*", "*/build/*", "*/dist/*"]

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--cov=SLR_BE",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["SLR_BE"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/migrations/*",
    "*/venv/*",
    "*/env/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# MyPy type checker
[tool.mypy]
python_version = "3.7"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "tensorflow.*",
    "cv2.*",
    "mediapipe.*",
]
ignore_missing_imports = true

# Ruff linter (alternative to flake8)
[tool.ruff]
line-length = 100
target-version = "py37"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["E501"]

[tool.ruff.isort]
known-first-party = ["SLR_BE"]

